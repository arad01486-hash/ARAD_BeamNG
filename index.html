<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ARAD MOD STORE</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#0d0d0d;
color:white;
direction:rtl;
text-align:center;
}

.header{
background:#111;
padding:15px;
color:#00ffcc;
font-weight:bold;
font-size:20px;
}

.card{
background:#1a1a1a;
padding:15px;
margin:10px auto;
width:320px;
border-radius:10px;
border:1px solid #222;
}

button{
padding:10px 15px;
margin-top:8px;
background:#00ffcc;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00c2a3;
}

input{
padding:10px;
margin:5px;
width:200px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const app=document.getElementById("app");

let users=JSON.parse(localStorage.getItem("users")||"{}");
let user=JSON.parse(localStorage.getItem("user")||"null");

let mods=[
{name:"BMW MOD",price:0,url:"https://example.com"},
{name:"DRIFT PACK",price:5,url:"https://example.com"}
];

/* ================= LOGIN ================= */

function loginPage(){
app.innerHTML=`
<div class="header">ARAD MOD STORE</div>

<h3>Login / Register</h3>

<input id="email" placeholder="email"><br>
<input id="pass" type="password" placeholder="password"><br>

<br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
`;
}

/* ================= REGISTER ================= */

function register(){

let e=document.getElementById("email").value;
let p=document.getElementById("pass").value;

if(!e||!p) return alert("پر کن");

if(users[e]) return alert("وجود دارد");

users[e]={email:e,pass:p,mods:[]};

localStorage.setItem("users",JSON.stringify(users));

alert("ساخته شد");
}

/* ================= LOGIN ================= */

function login(){

let e=document.getElementById("email").value;
let p=document.getElementById("pass").value;

if(users[e] && users[e].pass===p){

user=users[e];
localStorage.setItem("user",JSON.stringify(user));

dashboard();

}else{
alert("اشتباه");
}
}

/* ================= DASHBOARD ================= */

function dashboard(){

app.innerHTML=`
<div class="header">ARAD MOD STORE</div>

<button onclick="store()">Store</button>
<button onclick="myMods()">My Mods</button>
<button onclick="logout()">Logout</button>

<div id="main"></div>
`;

window.main=document.getElementById("main");

store();
}

/* ================= STORE ================= */

function store(){

main.innerHTML="<h3>🚗 مودها</h3>";

mods.forEach((m,i)=>{
main.innerHTML+=`
<div class="card">
<b>${m.name}</b><br>
💰 ${m.price==0?"Free":m.price+"$"}<br>

<button onclick="buy(${i})">
${m.price==0?"Download":"Buy"}
</button>
</div>
`;
});
}

/* ================= BUY ================= */

function buy(i){

if(mods[i].price==0){
add(i);
return;
}

alert("خرید انجام شد (تستی)");
add(i);
}

/* ================= ADD MOD ================= */

function add(i){

let users=JSON.parse(localStorage.getItem("users"));
let u=JSON.parse(localStorage.getItem("user"));

users[u.email].mods.push(mods[i]);

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("user",JSON.stringify(users[u.email]));

alert("اضافه شد به حساب");
}

/* ================= MY MODS ================= */

function myMods(){

let u=JSON.parse(localStorage.getItem("user"));

main.innerHTML="<h3>📥 My Mods</h3>";

if(!u.mods.length){
main.innerHTML+="<div class='card'>هیچی نداری</div>";
return;
}

u.mods.forEach(m=>{
main.innerHTML+=`
<div class="card">
${m.name}<br>
<button onclick="window.open('${m.url}')">Download</button>
</div>
`;
});
}

/* ================= LOGOUT ================= */

function logout(){
localStorage.removeItem("user");
location.reload();
}

/* ================= START ================= */

if(user){
dashboard();
}else{
loginPage();
}

</script>

</body>
</html>
