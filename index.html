<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ARAD PRO MOD STORE</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#0b0f14;
color:white;
direction:rtl;
}

.box{
background:#111827;
padding:15px;
margin:10px auto;
width:320px;
border-radius:10px;
}

input,button{
padding:10px;
margin:5px;
width:200px;
}

button{
background:#00ffcc;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div id="app"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>

/* ================= FIREBASE ================= */
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
storageBucket: "YOUR_BUCKET"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

const app=document.getElementById("app");

/* ================= LOGIN ================= */

function loginPage(){
app.innerHTML=`
<h2>ARAD PRO LOGIN</h2>

<div class="box">
<input id="email" placeholder="email"><br>
<input id="pass" type="password" placeholder="password"><br>

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
`;
}

function register(){
auth.createUserWithEmailAndPassword(email.value,pass.value)
.then(()=>alert("ساخته شد"))
.catch(e=>alert(e.message));
}

function login(){
auth.signInWithEmailAndPassword(email.value,pass.value)
.then(()=>dashboard())
.catch(e=>alert(e.message));
}

/* ================= DASHBOARD ================= */

function dashboard(){

app.innerHTML=`
<h2>🔥 ARAD MOD STORE PRO</h2>

<button onclick="store()">Store</button>
<button onclick="admin()">Admin Panel</button>
<button onclick="logout()">Logout</button>

<div id="main"></div>
`;

window.main=document.getElementById("main");

store();
}

/* ================= STORE ================= */

async function store(){

main.innerHTML="<h3>Mods</h3>";

let snap=await db.collection("mods").get();

snap.forEach(doc=>{
let m=doc.data();

main.innerHTML+=`
<div class="box">
<b>${m.name}</b><br>
💰 ${m.price}<br>

<button onclick="download('${m.url}')">
Download
</button>
</div>
`;
});
}

/* ================= DOWNLOAD ================= */

function download(url){
window.open(url);
}

/* ================= ADMIN UPLOAD ================= */

function admin(){

app.innerHTML=`
<h2>🧑‍💻 Admin Panel</h2>

<div class="box">
<input id="name" placeholder="name"><br>
<input id="price" placeholder="price"><br>
<input id="file" type="file"><br>

<button onclick="upload()">Upload Mod</button>
</div>
<div id="main"></div>
`;
}

async function upload(){

let file=document.getElementById("file").files[0];

let ref=storage.ref("mods/"+file.name);

await ref.put(file);

let url=await ref.getDownloadURL();

await db.collection("mods").add({
name:name.value,
price:price.value,
url:url
});

alert("آپلود شد");
dashboard();
}

/* ================= LOGOUT ================= */

function logout(){
auth.signOut().then(()=>loginPage());
}

/* ================= START ================= */

auth.onAuthStateChanged(user=>{
if(user) dashboard();
else loginPage();
});

loginPage();

</script>

</body>
</html>
