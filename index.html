<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ARAD STORE PRO UI</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background: radial-gradient(circle at top,#1a1a1a,#000);
color:white;
direction:rtl;
text-align:center;
}

h2{
color:#00ffcc;
text-shadow:0 0 10px #00ffcc;
}

.card{
background:linear-gradient(145deg,#1c1c1c,#0e0e0e);
padding:15px;
margin:12px;
border-radius:14px;
display:inline-block;
width:320px;
border:1px solid #222;
transition:0.2s;
box-shadow:0 0 10px rgba(0,255,204,0.1);
}

.card:hover{
transform:scale(1.05);
border-color:#00ffcc;
box-shadow:0 0 20px rgba(0,255,204,0.4);
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00ffcc;
color:black;
font-weight:bold;
}

button:hover{
background:#00ccaa;
}

input{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
outline:none;
width:200px;
}

.topbar{
background:#111;
padding:10px;
border-bottom:1px solid #222;
margin-bottom:20px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const app = document.getElementById("app");

let users = JSON.parse(localStorage.getItem("users") || "{}");
let currentUser = JSON.parse(localStorage.getItem("user") || "null");

let mods = [
{name:"BMW M5 DRIFT",price:0,url:"https://example.com"},
{name:"JDM PACK PRO",price:5,url:"https://example.com"},
{name:"OFFROAD MONSTER",price:3,url:"https://example.com"}
];

/* ================= LOGIN ================= */

function loginPage(){
app.innerHTML=`
<div class="topbar">
<h2>🔥 ARAD STORE</h2>
</div>

<h3>Login / Register</h3>

<input id="email" placeholder="email"><br>
<input id="pass" type="password" placeholder="password"><br>

<br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
`;
}

/* ================= REGISTER ================= */

function register(){
let email=email.value;
let pass=pass.value;

if(!email||!pass){
alert("پر کن");
return;
}

if(users[email]){
alert("قبلاً ثبت شده");
return;
}

users[email]={email,pass,mods:[]};
localStorage.setItem("users",JSON.stringify(users));

alert("ساخته شد");
}

/* ================= LOGIN ================= */

function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

if(users[email] && users[email].pass===pass){
currentUser=users[email];
localStorage.setItem("user",JSON.stringify(currentUser));
dashboard();
}else{
alert("اشتباه");
}
}

/* ================= DASHBOARD ================= */

function dashboard(){
app.innerHTML=`
<div class="topbar">
<h2>🔥 ARAD STORE</h2>
<button onclick="store()">Store</button>
<button onclick="myMods()">My Mods</button>
<button onclick="logout()">Logout</button>
</div>

<div id="main"></div>
`;

window.main=document.getElementById("main");
store();
}

/* ================= STORE ================= */

function store(){
main.innerHTML="<h3>🚗 Mods</h3>";

mods.forEach((m,i)=>{
main.innerHTML+=`
<div class="card">
<b>${m.name}</b><br>
💰 ${m.price==0?"Free":m.price+"$"}<br>

<button onclick="buy(${i})">
${m.price==0?"Download":"Buy"}
</button>
</div>
`;
});
}

/* ================= BUY ================= */

function buy(i){
if(mods[i].price==0){
addMod(i);
return;
}

alert("خرید موفق (تستی)");
addMod(i);
}

/* ================= ADD MOD ================= */

function addMod(i){
let users=JSON.parse(localStorage.getItem("users"));
let u=JSON.parse(localStorage.getItem("user"));

users[u.email].mods.push(mods[i]);

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("user",JSON.stringify(users[u.email]));

alert("اضافه شد");
}

/* ================= MY MODS ================= */

function myMods(){
let u=JSON.parse(localStorage.getItem("user"));

main.innerHTML="<h3>📥 My Mods</h3>";

if(!u.mods.length){
main.innerHTML+="<div class='card'>خالیه</div>";
return;
}

u.mods.forEach(m=>{
main.innerHTML+=`
<div class="card">
${m.name}<br>
<button onclick="window.open('${m.url}')">Download</button>
</div>
`;
});
}

/* ================= LOGOUT ================= */

function logout(){
localStorage.removeItem("user");
currentUser=null;
loginPage();
}

/* ================= START ================= */

if(currentUser){
dashboard();
}else{
loginPage();
}

</script>

</body>
</html>
