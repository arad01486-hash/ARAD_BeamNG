<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ARAD STEAM STORE</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0b0f14;
color:white;
direction:rtl;
}

.topbar{
background:#111827;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
color:#00ffcc;
font-weight:bold;
font-size:18px;
}

.btn{
background:#00ffcc;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn:hover{background:#00c2a3;}

.container{
display:flex;
}

.sidebar{
width:220px;
background:#0f172a;
height:100vh;
padding:10px;
border-left:1px solid #222;
}

.sidebar button{
width:100%;
margin:5px 0;
padding:10px;
background:#111827;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.sidebar button:hover{
background:#1f2937;
}

.main{
flex:1;
padding:20px;
}

.card{
background:#111827;
padding:15px;
margin:10px;
border-radius:12px;
border:1px solid #1f2937;
transition:0.2s;
}

.card:hover{
transform:scale(1.03);
border-color:#00ffcc;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">🔥 ARAD STEAM STORE</div>
<div>
<button class="btn" onclick="logout()">Logout</button>
</div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="showStore()">Store</button>
<button onclick="showCart()">Cart</button>
<button onclick="showAdmin()">Admin</button>
</div>

<div class="main" id="main"></div>

</div>

<script>

/* ================= SAFE STORAGE ================= */
let users = JSON.parse(localStorage.getItem("users") || "{}");
let user = JSON.parse(localStorage.getItem("user") || "null");

let cart = [];

let mods = [
{name:"BMW M5 Drift",price:0,url:"#"},
{name:"JDM Pack Pro",price:5,url:"#"},
{name:"Offroad Beast",price:3,url:"#"}
];

/* ================= LOGIN ================= */

function loginPage(){
document.body.innerHTML=`
<div style="text-align:center;margin-top:100px;">
<h2>Login</h2>
<input id="email" placeholder="email"><br><br>
<input id="pass" type="password" placeholder="password"><br><br>

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
`;
}

function register(){
let e=document.getElementById("email").value;
let p=document.getElementById("pass").value;

if(!e||!p) return alert("پر کن");

if(users[e]) return alert("وجود دارد");

users[e]={email:e,pass:p,mods:[]};
localStorage.setItem("users",JSON.stringify(users));

alert("ساخته شد");
}

function login(){
let e=document.getElementById("email").value;
let p=document.getElementById("pass").value;

if(users[e] && users[e].pass===p){
user=users[e];
localStorage.setItem("user",JSON.stringify(user));
init();
}else{
alert("اشتباه");
}
}

/* ================= INIT ================= */

function init(){
document.body.innerHTML=`
<div class="topbar">
<div class="logo">🔥 ARAD STEAM STORE</div>
<button class="btn" onclick="logout()">Logout</button>
</div>

<div class="container">
<div class="sidebar">
<button onclick="showStore()">Store</button>
<button onclick="showCart()">Cart</button>
<button onclick="showAdmin()">Admin</button>
</div>

<div class="main" id="main"></div>
</div>
`;

showStore();
}

/* ================= STORE ================= */

function showStore(){

main.innerHTML="<h2>🚗 Store</h2>";

mods.forEach((m,i)=>{
main.innerHTML+=`
<div class="card">
<b>${m.name}</b><br>
💰 ${m.price==0?"Free":m.price+"$"}<br><br>

<button class="btn" onclick="buy(${i})">
${m.price==0?"Download":"Buy"}
</button>
</div>
`;
});
}

/* ================= BUY ================= */

function buy(i){

let u=JSON.parse(localStorage.getItem("user"));

if(mods[i].price==0){
add(i);
return;
}

alert("پرداخت شبیه‌سازی شد");
add(i);
}

/* ================= ADD ================= */

function add(i){

let users=JSON.parse(localStorage.getItem("users"));
let u=JSON.parse(localStorage.getItem("user"));

users[u.email].mods.push(mods[i]);

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("user",JSON.stringify(users[u.email]));

alert("اضافه شد");
}

/* ================= CART ================= */

function showCart(){
main.innerHTML="<h2>🛒 Cart</h2><div class='card'>نسخه بعدی کامل میشه</div>";
}

/* ================= ADMIN ================= */

function showAdmin(){
main.innerHTML=`
<h2>🧑‍💻 Admin Panel</h2>

<input id="name" placeholder="name"><br>
<input id="price" placeholder="price"><br>

<button class="btn" onclick="addMod()">Add Mod</button>
`;
}

function addMod(){

mods.push({
name:name.value,
price:Number(price.value),
url:"#"
});

alert("اضافه شد");
showStore();
}

/* ================= LOGOUT ================= */

function logout(){
localStorage.removeItem("user");
location.reload();
}

/* ================= START ================= */

if(user){
init();
}else{
loginPage();
}

</script>

</body>
</html>
