<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAD BeamNG PRO</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#0a0f1f;
color:white;
}

nav{
background:#111827;
padding:15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

nav a{
color:#00e5ff;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

header{
padding:70px 20px;
text-align:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
}

h1{color:#00e5ff;font-size:55px}

.btn{
padding:10px 15px;
background:#00e5ff;
color:black;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin:10px;
}

.section{
padding:40px 20px;
}

h2{color:#00e5ff}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:10px;
border-radius:12px;
transition:.3s;
}

.card:hover{transform:scale(1.05)}

.card img{
width:100%;
border-radius:10px;
}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.box{
background:#1e293b;
padding:20px;
border-radius:15px;
width:300px;
text-align:center;
}

input{
padding:10px;
width:90%;
margin:5px 0;
border-radius:10px;
border:none;
}

.hide{display:none !important}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<a href="#home">خانه</a>
<a href="#gallery">گالری</a>
<a href="#mods">مودها</a>
<a href="#news">اخبار</a>
</nav>

<!-- HERO -->
<header id="home">
<h1>ARAD BeamNG 🚗</h1>
<p>سایت حرفه‌ای مود و شات BeamNG</p>

<button class="btn" onclick="login()">ورود ادمین</button>
<button class="btn hide" id="upBtn" onclick="openUpload()">📤 آپلود</button>
</header>

<!-- GALLERY -->
<section class="section" id="gallery">
<h2>🖼️ گالری</h2>
<div class="grid" id="galleryBox"></div>
</section>

<!-- MODS -->
<section class="section" id="mods">
<h2>🆓 مودها</h2>

<div class="grid">
<div class="card"><h3>پژو 405</h3></div>
<div class="card"><h3>پراید اسپرت</h3></div>
</div>
</section>

<!-- NEWS -->
<section class="section" id="news">
<h2>📢 اخبار</h2>

<div class="card">🔥 سایت ARAD BeamNG آنلاین شد</div>
<div class="card">🚗 سیستم آپلود فعال شد</div>
</section>

<!-- UPLOAD -->
<div class="modal" id="modal">
<div class="box">

<h3>📤 آپلود شات</h3>
<input type="file" id="file">
<button class="btn" onclick="upload()">آپلود</button>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3OjZrgFVpfdayvDSOFB5f5OmChDj4tvo",
  authDomain: "arad-beamng.firebaseapp.com",
  projectId: "arad-beamng",
  storageBucket: "arad-beamng.firebasestorage.app",
  messagingSenderId: "259621342630",
  appId: "1:259621342630:web:8640e6c867e38980abd367",
  measurementId: "G-89MH9P5GZV"
};

initializeApp(firebaseConfig);
</script>

<script>
let isAdmin=false;

/* LOGIN */
function login(){
let pass=prompt("رمز ادمین:");

if(pass==="1234"){
alert("ادمین شدی 😎");
isAdmin=true;
document.getElementById("upBtn").classList.remove("hide");
}else{
alert("اشتباهه!");
}
}

/* OPEN UPLOAD */
function openUpload(){
document.getElementById("modal").style.display="flex";
}

/* UPLOAD (فعلاً محلی + گالری) */
function upload(){
let file=document.getElementById("file").files[0];

if(!file){
alert("فایل انتخاب کن");
return;
}

let reader=new FileReader();

reader.onload=function(e){

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${e.target.result}">
<p>${file.name}</p>
`;

document.getElementById("galleryBox").appendChild(div);

alert("Upload Successful 🚀");
};

reader.readAsDataURL(file);

document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
