<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAD BeamNG PRO DASHBOARD</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#0a0f1f;
color:white;
}

/* LOGIN */
#login{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
width:220px;
}

.btn{
padding:10px 15px;
background:#00e5ff;
color:black;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* DASHBOARD */
#dash{
display:none;
height:100vh;
grid-template-columns:220px 1fr;
display:grid;
}

/* SIDEBAR */
.sidebar{
background:#111827;
padding:15px;
display:flex;
flex-direction:column;
}

.sidebar button{
margin:5px 0;
}

/* MAIN */
.main{
padding:20px;
overflow:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:12px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.item{
background:#1e293b;
padding:10px;
border-radius:10px;
position:relative;
}

.item img{
width:100%;
border-radius:10px;
}

.del{
position:absolute;
top:5px;
left:5px;
background:red;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>🔐 Login</h2>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dash">

<!-- SIDEBAR -->
<div class="sidebar">
<h3>🚗 ARAD PANEL</h3>

<button class="btn" onclick="show('home')">🏠 داشبورد</button>
<button class="btn" onclick="show('upload')">📤 آپلود</button>
<button class="btn" onclick="show('gallery')">🖼️ گالری</button>
<button class="btn" onclick="logout()">🚪 خروج</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- HOME -->
<div id="home">
<h2>📊 داشبورد</h2>

<div class="cards">
<div class="card">
<h3 id="count">0</h3>
<p>تعداد فایل‌ها</p>
</div>

<div class="card">
<h3>🔥 LIVE</h3>
<p>سایت آنلاین</p>
</div>
</div>

</div>

<!-- UPLOAD -->
<div id="upload" style="display:none">
<h2>📤 آپلود فایل</h2>
<input type="file" id="file">
<button class="btn" onclick="upload()">آپلود</button>
</div>

<!-- GALLERY -->
<div id="gallery" style="display:none">
<h2>🖼️ گالری</h2>
<div class="grid" id="galleryBox"></div>
</div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3OjZrgFVpfdayvDSOFB5f5OmChDj4tvo",
  authDomain: "arad-beamng.firebaseapp.com",
  projectId: "arad-beamng",
  storageBucket: "arad-beamng.appspot.com",
  messagingSenderId: "259621342630",
  appId: "1:259621342630:web:8640e6c867e38980abd367"
};

const ADMIN_EMAIL = "admin@gmail.com"; // 👑 ایمیل خودت رو اینجا بزن

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);

/* LOGIN */
window.login = async function(){
const email = document.getElementById("email").value;
const pass = document.getElementById("pass").value;

await signInWithEmailAndPassword(auth,email,pass);
}

/* LOGOUT */
window.logout = function(){
signOut(auth);
}

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("dash").style.display="grid";
loadGallery();
}else{
document.getElementById("login").style.display="flex";
document.getElementById("dash").style.display="none";
}
});

/* NAV */
window.show = function(page){
document.getElementById("home").style.display="none";
document.getElementById("upload").style.display="none";
document.getElementById("gallery").style.display="none";

document.getElementById(page).style.display="block";

if(page==="gallery") loadGallery();
}

/* UPLOAD */
window.upload = async function(){
const file = document.getElementById("file").files[0];

const fileRef = ref(storage,"uploads/"+file.name);
await uploadBytes(fileRef,file);

const url = await getDownloadURL(fileRef);

await addDoc(collection(db,"gallery"),{
url:url,
name:file.name
});

loadGallery();
alert("Uploaded 🚀");
}

/* LOAD GALLERY */
async function loadGallery(){
const snap = await getDocs(collection(db,"gallery"));

const box = document.getElementById("galleryBox");
box.innerHTML="";
let count = 0;

snap.forEach(d=>{
const data = d.data();
count++;

box.innerHTML += `
<div class="item">
<button class="del" onclick="del('${d.id}')">X</button>
<img src="${data.url}">
<p>${data.name}</p>
</div>
`;
});

document.getElementById("count").innerText = count;
}

/* DELETE */
window.del = async function(id){
await deleteDoc(doc(db,"gallery",id));
loadGallery();
}

</script>

</body>
</html>
