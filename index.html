<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ARAD STORE SAFE</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#0b0b0b;
color:white;
text-align:center;
direction:rtl;
}

.card{
background:#1a1a1a;
padding:15px;
margin:10px;
border-radius:10px;
display:inline-block;
width:300px;
}

button,input{
padding:10px;
margin:5px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* ================= SAFE CORE ================= */

const app = document.getElementById("app");

let users = JSON.parse(localStorage.getItem("users") || "{}");
let currentUser = JSON.parse(localStorage.getItem("user") || "null");

let mods = [
{name:"BMW MOD",price:0,url:"https://example.com"},
{name:"DRIFT PACK",price:5,url:"https://example.com"}
];

/* ================= LOGIN PAGE ================= */

function loginPage(){
app.innerHTML=`
<h2>🔐 Login / Register</h2>

<input id="email" placeholder="email"><br>
<input id="pass" type="password" placeholder="password"><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
`;
}

/* ================= REGISTER ================= */

function register(){

let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

if(!email || !pass){
alert("پر کن");
return;
}

if(users[email]){
alert("قبلاً ثبت شده");
return;
}

users[email] = {email,pass,mods:[]};

localStorage.setItem("users",JSON.stringify(users));

alert("ساخته شد");
}

/* ================= LOGIN ================= */

function login(){

let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

if(users[email] && users[email].pass === pass){

currentUser = users[email];

localStorage.setItem("user",JSON.stringify(currentUser));

dashboard();

}else{
alert("اشتباه");
}
}

/* ================= DASHBOARD ================= */

function dashboard(){

app.innerHTML=`
<h2>🔥 ARAD STORE</h2>

<button onclick="store()">Store</button>
<button onclick="myMods()">My Mods</button>
<button onclick="logout()">Logout</button>

<div id="main"></div>
`;

window.main = document.getElementById("main");

store();
}

/* ================= STORE ================= */

function store(){

main.innerHTML="<h3>🚗 Mods</h3>";

mods.forEach((m,i)=>{

main.innerHTML+=`
<div class="card">
<b>${m.name}</b><br>
💰 ${m.price==0?"Free":m.price+"$"}<br>

<button onclick="buy(${i})">
${m.price==0?"Download":"Buy"}
</button>
</div>
`;
});
}

/* ================= BUY ================= */

function buy(i){

let u = JSON.parse(localStorage.getItem("user"));

if(mods[i].price==0){
addMod(i);
return;
}

alert("خرید انجام شد (تستی)");
addMod(i);
}

/* ================= ADD MOD ================= */

function addMod(i){

users = JSON.parse(localStorage.getItem("users"));
currentUser = JSON.parse(localStorage.getItem("user"));

users[currentUser.email].mods.push(mods[i]);

localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("user",JSON.stringify(users[currentUser.email]));

alert("اضافه شد به حساب");
}

/* ================= MY MODS ================= */

function myMods(){

let u = JSON.parse(localStorage.getItem("user"));

main.innerHTML="<h3>📥 My Mods</h3>";

if(!u || !u.mods.length){
main.innerHTML+="<div class='card'>خالیه</div>";
return;
}

u.mods.forEach(m=>{
main.innerHTML+=`
<div class="card">
${m.name}<br>
<button onclick="window.open('${m.url}')">Download</button>
</div>
`;
});
}

/* ================= LOGOUT ================= */

function logout(){
localStorage.removeItem("user");
currentUser=null;
loginPage();
}

/* ================= START ================= */

if(currentUser){
dashboard();
}else{
loginPage();
}

</script>

</body>
</html>
