<!DOCTYPE html>

<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAD BeamNG Pro</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white}

/* LOGIN */
#loginPage{
position:fixed;top:0;left:0;width:100%;height:100%;
display:flex;justify-content:center;align-items:center;
background:#000;z-index:9999;
}

.box{
background:#1c1c1c;padding:20px;border-radius:10px;
text-align:center;box-shadow:0 0 20px #00c6ff;
}

input,button{padding:10px;margin:5px;border-radius:8px;border:none}

button{background:#00c6ff;cursor:pointer;font-weight:bold}

/* MAIN */
.hidden{display:none}

header{
background:linear-gradient(120deg,#00c6ff,#0072ff);
text-align:center;padding:30px
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;padding:20px
}

.card{
background:#1c1c1c;border-radius:10px;overflow:hidden
}

.card img{width:100%;height:150px;object-fit:cover}

.card-content{padding:10px}

.btn{
display:inline-block;background:#00c6ff;color:black;
padding:8px;border-radius:6px;text-decoration:none
}

/* ADMIN */
#adminPanel{
background:#111;padding:15px;margin:20px;border-radius:10px;
}
</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage">
<div class="box">
<h2>Login / Register</h2>
<input id="email" placeholder="Email"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
</div>

<!-- MAIN -->

<div id="main" class="hidden">

<header>
<h1>ARAD BeamNG Mods</h1>
<p>سیستم حرفه‌ای مود + آپلود</p>
</header>

<!-- ADMIN UPLOAD -->

<div id="adminPanel">
<h3>Upload Mod (Admin)</h3>
<input id="modName" placeholder="Name">
<input id="modFile" placeholder="File URL">
<button onclick="addMod()">Add</button>
</div>

<div class="container" id="mods"></div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
// 🔥 Firebase Config (اینو باید خودت پر کنی)
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_ID",
storageBucket: "YOUR_BUCKET"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* REGISTER */
function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

auth.createUserWithEmailAndPassword(email,pass)
.then(()=>document.getElementById("msg").innerText="Registered!")
.catch(e=>document.getElementById("msg").innerText=e.message);
}

/* LOGIN */
function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
document.getElementById("loginPage").style.display="none";
document.getElementById("main").classList.remove("hidden");
loadMods();
})
.catch(e=>document.getElementById("msg").innerText=e.message);
}

/* ADD MOD (ADMIN ONLY) */
function addMod(){
let name=document.getElementById("modName").value;
let file=document.getElementById("modFile").value;

db.collection("mods").add({
name:name,
file:file
});
loadMods();
}

/* LOAD MODS */
function loadMods(){
document.getElementById("mods").innerHTML="";
db.collection("mods").get().then(snap=>{
snap.forEach(doc=>{
let m=doc.data();

document.getElementById("mods").innerHTML+=`
<div class="card">
<div class="card-content">
<h3>${m.name}</h3>
<a class="btn" href="${m.file}" target="_blank">Download</a>
</div>
</div>`;
});
});
}
</script>

</body>
</html>
